[project]
name = "python-selenium-api-tests"
version = "0.1.0"
description = ""
authors = [
    {name = "ntitenok",email = "titenok.n@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "selenium (>=4.51.0,<5.0.0)",
    "allure-pytest (>=2.16.2,<3.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.poetry]
package-mode = false